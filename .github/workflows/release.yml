name: Release

# 打 tag 即发布（Trusted Publishing，无需 API token）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # 也支持手动触发

jobs:
  build:
    name: 构建 sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 构建
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: 发布到 PyPI
    needs: build
    runs-on: ubuntu-latest
    # ★ 必须与 PyPI 网页上 Trusted Publisher 里填的 environment 一致
    environment: pypi
    permissions:
      id-token: write        # OIDC：不需要任何 API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: 发布
        uses: pypa/gh-action-pypi-publish@release/v1
