[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphalens-cna"
version = "0.1.5"
description = "中国 A 股因子研究工具链 —— alphalens 的替代品，带推断层、数据体检与 A 股成交规则"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "alphalens-cna contributors" }]
keywords = ["quant", "factor", "alphalens", "a-share", "china", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.22", "pandas>=1.5", "scipy>=1.9"]

[project.optional-dependencies]
# 对拍用（防线 4）。**运行本库本身不需要它**
compat = ["alphalens-reloaded>=0.4.6"]
# 私有数据源适配器（examples/ 里的 mongo 适配器）
mongo = ["pymongo>=4.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
packages = [
  "alphalens_cna",
  "alphalens_cna.contract",
  "alphalens_cna.adapters",
  "alphalens_cna.adapters.input",
  "alphalens_cna.engine",
  "alphalens_cna.preprocess",
  "alphalens_cna.analysis",
  "alphalens_cna.inference",
  "alphalens_cna.health",
  "alphalens_cna.compat",
  "alphalens_cna.ledger",
  "alphalens_cna.report",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
